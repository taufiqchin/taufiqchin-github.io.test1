<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media Maker</title>
  <link rel="icon" type="image/png" href="../favicon/MT.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app-layout">
    <aside id="controls" class="panel controls-panel">
      <div class="sidebar-brand">
        <h1>Social Media Maker</h1>
        <p>Create posts, stories, logos, profile pictures &amp; covers</p>
      </div>

      <section class="section">
        <h2>Asset Type</h2>
        <div id="asset-type-list" class="asset-type-list"></div>
        <p id="asset-badge" class="badge"></p>
        <p id="asset-promo" class="asset-promo"></p>
      </section>

      <section class="section">
        <h2>Background</h2>
        <div class="radio-group">
          <label><input type="radio" name="bg-mode" id="bg-mode-color" value="color" checked /> Solid color</label>
          <label><input type="radio" name="bg-mode" id="bg-mode-image" value="image" /> Image</label>
        </div>
        <div id="bg-color-wrap">
          <label>Color</label>
          <div class="bg-color-box">
            <div id="bg-color-presets" class="bg-color-presets"></div>
            <label class="bg-color-picker-swatch" id="bg-color-picker-wrap" title="Custom color">
              <input type="color" id="bg-color" value="#f7d9bc" />
            </label>
          </div>
          <input type="text" id="bg-color-hex" class="hex-input bg-color-hex-input" value="#f7d9bc" spellcheck="false" maxlength="7" placeholder="#FFFFFF" />
        </div>
        <div id="bg-image-wrap" style="display:none">
          <label class="file-btn">
            Upload background
            <input type="file" id="bg-image-input" accept="image/*" hidden />
          </label>
          <label>Blur <span id="bg-blur-val">0%</span>
            <input type="range" id="bg-blur" min="0" max="100" value="0" />
          </label>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Overlay Images</h2>
          <button type="button" id="add-image" class="btn-small">+ Add image</button>
        </div>
        <div id="image-slots"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Text</h2>
          <button type="button" id="add-text" class="btn-small">+ Add text</button>
        </div>
        <div id="text-list"></div>
      </section>

      <section class="section">
        <label>Download format
          <select id="export-format">
            <option value="png" selected>PNG</option>
            <option value="jpeg">JPEG</option>
          </select>
        </label>
        <button type="button" id="export-btn" class="btn-primary">Download</button>
      </section>
    </aside>

    <section class="panel preview-panel">
      <div class="preview-header">
        <h2>Live Preview</h2>
        <p id="status-line" class="status-line"></p>
      </div>
      <div class="canvas-wrap">
        <canvas id="preview-canvas"></canvas>
      </div>
      <p class="hint">Drag to move. Drag corner handles to resize. Drag the round handle above an image to rotate.</p>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
